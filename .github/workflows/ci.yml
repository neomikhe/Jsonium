name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verificar que no hay peticiones de red
        run: |
          # El runtime de Workbox usa fetch por definicion: un service worker sirve
          # desde cache lo que se le pida. El resto del bundle no puede usarlo.
          if grep -rlInE "fetch\(|XMLHttpRequest|new WebSocket|sendBeacon" dist --include="*.js" | grep -v "workbox-"; then
            echo "::error::Codigo de la aplicacion con primitivas de red. Jsonium no hace peticiones."
            exit 1
          fi

      - name: Verificar que el service worker solo precachea el propio origen
        run: |
          if grep -oE 'url:"[^"]*"' dist/sw.js | grep -E '://'; then
            echo "::error::El service worker precachea un origen externo."
            exit 1
          fi
